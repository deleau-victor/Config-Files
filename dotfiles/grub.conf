###############################################################################
# SOURCE   : ~/Sources/System/Config/dotfiles/grub.conf
# TARGET   : /etc/default/grub
# DESC     : Configuration du GRub
# OS       : fedora
# WARN     : Ne pas monter ce fichier en symlink
###############################################################################
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="$(sed 's, release .*$,,g' /etc/system-release)"
GRUB_DEFAULT=saved
GRUB_DISABLE_SUBMENU=true
GRUB_TERMINAL_OUTPUT="console"
GRUB_CMDLINE_LINUX="rhgb quiet rd.driver.blacklist=nouveau,nova_core modprobe.blacklist=nouveau,nova_core nvidia-drm.modeset=1 nvidia-drm.fbdev=1 nvidia.NVreg_PreserveVideoMemoryAllocations=1 nvidia.NVreg_TemporaryFilePath=/var/tmp"
GRUB_DISABLE_RECOVERY="true"
GRUB_ENABLE_BLSCFG=true

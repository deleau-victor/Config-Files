###############################################################################
# SOURCE   : ~/Sources/System/Config/dotfiles/tmux.conf
# TARGET   : ~/.tmux.conf
# DESC     : Configuration TMUX
###############################################################################
# ── Général ──────────────────────────────────────────
# Vraies couleurs + support Ghostty
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

# Extended keys (Ctrl+Enter, etc. pour Claude Code)
set -s extended-keys on
set -as terminal-features '*:extkeys'

# Réactivité
set -s escape-time 0
set -g focus-events on

# Historique
set -g history-limit 50000

# Index à 1 (plus logique sur le clavier)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Souris ───────────────────────────────────────────
set -g mouse on

# ── Splits plus intuitifs ────────────────────────────
# | et - au lieu de % et ", en gardant le répertoire courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Navigation panneaux style vim ────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionner (répétable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode vim ────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Presse-papiers : clip.exe sous WSL, wl-copy sous Wayland
if-shell 'grep -qi microsoft /proc/version' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'

# ── Reload config ────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config rechargée"

# ── Barre de statut sobre ────────────────────────────
set -g status-position top
set -g status-style "bg=default,fg=colour244"
set -g status-left "#[fg=colour109,bold] #S "
set -g status-left-length 20
set -g status-right "#[fg=colour244]%H:%M "
setw -g window-status-current-style "fg=colour223,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

///////////////////////////////////////////////////////////////////////////////
// SOURCE   : ~/Sources/System/Config/dotfiles/vscode.fedora-wsl.conf
// TARGET   : %APPDATA%/Code/User/settings.json
// DESC     : Configuration VS Code
// OS       : wsl
// MODE     : copy
///////////////////////////////////////////////////////////////////////////////
{
    "workbench.browser.openLocalhostLinks": false,
    "workbench.colorTheme": "Monokai Dimmed × One Dark Pro",
    "workbench.iconTheme": "material-icon-theme",
    "workbench.productIconTheme": "jetbrains-idea-product-icon-theme",
    "workbench.tree.indent": 22,
    "workbench.tree.renderIndentGuides": "always",
    "workbench.editorAssociations": {
        "*.copilot.md": "vscode.markdown.preview.editor",
        "*.svg": "default",
        "git-rebase-todo": "gitlens.rebase",
    },
    // "custom-ui-style.external.imports": [
    //   "file:///C:/Users/ART180/.vscode/extensions/ui-patch/css.css",
    //   "file:///C:/Users/ART180/.vscode/extensions/ui-patch/js.js",
    // ],
    // "custom-ui-style.external.loadStrategy": "cache",
    "notebook.diff.enablePreview": false,
    // *******************************************
    // ************** Editor Config **************
    // *******************************************
    "editor.acceptSuggestionOnCommitCharacter": false,
    "editor.accessibilitySupport": "off",
    "editor.cursorBlinking": "solid",
    "editor.defaultFormatter": "esbenp.prettier-vscode",
    "[csharp]": {
        "editor.defaultFormatter": "ms-dotnettools.csharp",
    },
    "editor.fontFamily": "'Monolisa'",
    "editor.fontLigatures": true,
    "editor.fontSize": 14,
    "editor.fontWeight": "normal",
    "editor.formatOnSave": true,
    "editor.guides.bracketPairs": true,
    "editor.guides.indentation": false,
    "editor.inlayHints.enabled": "off",
    "editor.inlineSuggest.enabled": true,
    "editor.inlineSuggest.showToolbar": "always",
    "editor.lineHeight": 22,
    "editor.linkedEditing": true,
    "editor.minimap.enabled": false,
    "editor.renderWhitespace": "trailing",
    "editor.snippetSuggestions": "inline",
    "editor.suggest.insertMode": "replace",
    "editor.tabSize": 4,
    "editor.wordWrap": "on",
    "editor.wordWrapColumn": 120,
    // *******************************************
    // *********** Diff Editor Config ************
    // *******************************************
    "diffEditor.wordWrap": "on",
    // *******************************************
    // ************** Files Config ***************
    // *******************************************
    "files.autoSave": "onFocusChange",
    "files.eol": "\n",
    "files.exclude": {
        "**/.git": true,
        "**/.svn": true,
        "**/.hg": true,
        "**/CVS": true,
        "**/.DS_Store": true,
        "**/Thumbs.db": true,
        "**/bin/**": true,
        "**/obj/**": true,
    },
    "files.associations": {
        "*.json": "jsonc",
        "*.xml": "html",
        "*.svg": "html",
    },
    // *******************************************
    // ************* Explorer Config *************
    // *******************************************
    "explorer.autoReveal": false,
    "explorer.confirmDelete": false,
    "explorer.confirmDragAndDrop": false,
    "explorer.compactFolders": false,
    // *******************************************
    // ************ Javascript Config ************
    // *******************************************
    "javascript.updateImportsOnFileMove.enabled": "always",
    "typescript.updateImportsOnFileMove.enabled": "always",
    "vue.updateImportsOnFileMove.enabled": true,
    // *******************************************
    // ************** Emmet Config ***************
    // *******************************************
    "emmet.triggerExpansionOnTab": true,
    // *******************************************
    // *************** Git Config ****************
    // *******************************************
    "git.autofetch": true,
    "git.confirmSync": false,
    "git.enableSmartCommit": true,
    "git.replaceTagsWhenPull": true,
    "git.autoRepositoryDetection": "subFolders",
    "git.repositoryScanMaxDepth": 3,
    // *******************************************
    // ************* Prettier Config *************
    // *******************************************
    "prettier.arrowParens": "always",
    "prettier.bracketSpacing": true,
    "prettier.printWidth": 120,
    "prettier.semi": true,
    "prettier.singleQuote": false,
    "prettier.useTabs": false,
    "prettier.endOfLine": "lf",
    // *******************************************
    // ************* Material Config *************
    // *******************************************
    "material-icon-theme.hidesExplorerArrows": true,
    "material-icon-theme.activeIconPack": "vue_vuex",
    "material-icon-theme.folders.theme": "specific",
    "material-icon-theme.folders.associations": {
        "features": "App",
        "stores": "Ngrx-store",
        "http": "Api",
        "Converters": "pipe",
        "Endpoints": "Api",
        "Abstractions": "Base",
        "Persistence": "Database",
        "DependencyInjection": "../../../../custom-icons/folder-injection",
        "Commands": "../../../../custom-icons/folder-command",
        "Queries": "../../../../custom-icons/folder-query",
        "Caching": "../../../../custom-icons/folder-redis",
    },
    "material-icon-theme.files.associations": {
        "*.store.ts": "Angular-resolver",
        "*.cs": "../../custom-icons/csharp",
        "*.Tests.cs": "../../custom-icons/test-cs",
    },
    // *******************************************
    // ************* Terminal Config *************
    // *******************************************
    "terminal.integrated.defaultProfile.windows": "Zsh",
    "terminal.integrated.fontFamily": "MesloLGS NF",
    "terminal.integrated.profiles.windows": {
        "Command Prompt": {
            "path": [
                "${env:windir}\\Sysnative\\cmd.exe",
                "${env:windir}\\System32\\cmd.exe",
            ],
            "args": [],
            "icon": "terminal-cmd",
        },
        "Git Bash": {
            "source": "Git Bash",
        },
        "PowerShell": {
            "source": "PowerShell",
            "icon": "terminal-powershell",
        },
        "Zsh": {
            "path": "C:\\windows\\System32\\wsl.exe",
            "args": ["-d", "FedoraLinux-43"],
            "icon": "terminal-linux",
            "overrideName": true,
        },
    },
    // *******************************************
    // ************* Security Config *************
    // *******************************************
    "security.allowedUNCHosts": ["wsl.localhost"],
    "security.workspace.trust.untrustedFiles": "open",
    // *******************************************
    // ************** CSpell Config **************
    // *******************************************
    "cSpell.language": "en,fr",
    // *******************************************
    // *************** HTTP Config ***************
    // *******************************************
    "http.proxyStrictSSL": false,
    "http.proxy": null,
    // *******************************************
    // ********** Better Comment Config **********
    // *******************************************
    "better-comments.tags": [
        {
            "tag": "!",
            "color": "#FF2D00",
            "strikethrough": false,
            "underline": false,
            "backgroundColor": "transparent",
            "bold": false,
            "italic": false,
        },
        {
            "tag": "?",
            "color": "#3498DB",
            "strikethrough": false,
            "underline": false,
            "backgroundColor": "transparent",
            "bold": false,
            "italic": false,
        },
        {
            "tag": "//",
            "color": "#474747",
            "strikethrough": true,
            "underline": false,
            "backgroundColor": "transparent",
            "bold": false,
            "italic": false,
        },
        {
            "tag": "todo",
            "color": "#FF8C00",
            "strikethrough": false,
            "underline": false,
            "backgroundColor": "transparent",
            "bold": false,
            "italic": false,
        },
        {
            "tag": "*",
            "color": "#98C379",
            "strikethrough": false,
            "underline": false,
            "backgroundColor": "transparent",
            "bold": false,
            "italic": false,
        },
        {
            "tag": "#region",
            "color": "#FF8C00",
            "strikethrough": false,
            "underline": false,
            "backgroundColor": "transparent",
            "bold": false,
            "italic": false,
        },
        {
            "tag": "#endregion",
            "color": "#FF8C00",
            "strikethrough": false,
            "underline": false,
            "backgroundColor": "transparent",
            "bold": false,
            "italic": false,
        },
    ],
    // *******************************************
    // ************* LLM Chat Config *************
    // *******************************************
    "claudeCode.preferredLocation": "sidebar",
    "github.copilot.enable": {
        "*": true,
        "plaintext": false,
        "markdown": true,
        "scminput": false,
        "html": true,
        "csharp": true,
    },
    "chat.viewSessions.orientation": "stacked",
    // *******************************************
    // ************* JS Tests Config *************
    // *******************************************
    "jest.runMode": "on-demand",
    // *******************************************
    // ************** Remote Config **************
    // *******************************************
    "remote.SSH.configFile": "\\\\wsl.localhost\\FedoraLinux-43\\home\\vdeleau\\.ssh\\config",
    "remote.autoForwardPortsSource": "hybrid",
    "remote.SSH.remotePlatform": {
        "K3S_OVH": "linux",
    },
    // *******************************************
    // ********* Project Manager Config **********
    // *******************************************
    "projectManager.tags": [
        "FacturX",
        "GI",
        "Others",
        "RCP",
        "Synthesis",
        "Config",
        "EDI",
        "EFact",
        "Commun",
        "Packages",
        "Pilotage des dossiers",
    ],
    // *******************************************
    // *********** Markdown PDF Config ***********
    // *******************************************
    "markdown-pdf.styles": [
        // "C:\\Users\\ART180\\Documents\\md.css",
        "md.css",
    ],
    "markdown-pdf.displayHeaderFooter": false,
    "markdown-pdf.headerTemplate": "<div style='font-family:Inter, sans-serif; font-size:10px; padding:5px 10px; color:#6b7280; text-align:right;'>Mon Doc — <span class='title'></span></div>",
    "markdown-pdf.footerTemplate": "<div style='font-family:Inter, sans-serif; font-size:10px; color:#6b7280; padding:5px 10px; width:100%; text-align:center;'><span class='pageNumber'></span> / <span class='totalPages'></span></div>",
    "markdown-pdf.margin.top": "28mm",
    "markdown-pdf.margin.bottom": "18mm",
    "markdown-pdf.margin.left": "18mm",
    "markdown-pdf.margin.right": "18mm",
    // *******************************************
    // ************ HEX Editor Config ************
    // *******************************************
    "hexeditor.columnWidth": 16,
    "hexeditor.showDecodedText": false,
    "hexeditor.defaultEndianness": "little",
    "hexeditor.inspectorType": "aside",
    "docker.extension.enableComposeLanguageServer": false,
    "sonarlint.connectedMode.connections.sonarqube": [],
    "redhat.telemetry.enabled": false,
    "sonarlint.rules": {
        "csharpsquid:S2325": {
            "level": "off",
        },
        "csharpsquid:S1144": {
            "level": "off",
        },
        "csharpsquid:S3218": {
            "level": "off",
        },
        "csharpsquid:S125": {
            "level": "off",
        },
        "csharpsquid:S1854": {
            "level": "on",
        },
    },
    "window.controlsStyle": "custom",
    "atlascode.jira.enabled": true,
    "atlascode.bitbucket.enabled": false,
    "vs-kubernetes": {
        "vscode-kubernetes.minikube-path-linux": "/home/vdeleau/.local/state/vs-kubernetes/tools/minikube/linux-amd64/minikube",
        "vscode-kubernetes.helm-path-linux": "/home/vdeleau/.local/state/vs-kubernetes/tools/helm/linux-amd64/helm",
    },
    "projectManager.sortList": "Name",
    "sonarlint.pathToNodeExecutable": "~/.nvm/versions/node/v24.14.1/bin/node",
    "azdo-pr.organization": "artic-cerfrance",
    "azdo-pr.project": "Api.Artic.PilotageDossiersProd",
}

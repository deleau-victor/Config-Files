###############################################################################
# SOURCE   : ~/Sources/System/Config/dotfiles/zsh.conf
# TARGET   : ~/.zshrc
# DESC     : Configuration ZSH
###############################################################################
# --- ZINIT ---
source "$HOME/.local/share/zinit/zinit.git/zinit.zsh"

# --- HISTORIQUE ---
HISTFILE="$HOME/.zsh_history"
HISTSIZE=50000
SAVEHIST=50000
setopt EXTENDED_HISTORY       # horodatage
setopt SHARE_HISTORY          # partagé entre terminaux, écrit immédiatement
setopt HIST_IGNORE_ALL_DUPS   # pas de doublons
setopt HIST_IGNORE_SPACE      # commande précédée d'un espace = non enregistrée
setopt HIST_REDUCE_BLANKS

# --- ENVIRONNEMENT ---
export DOTFILES="$HOME/Sources/System/Config"
export REPOS="$HOME/Sources/Repos"
export GOROOT="/usr/local/go"
export GOPATH="$HOME/.local/share/go"
export PNPM_HOME="$HOME/.local/share/pnpm"
export NVM_DIR="$HOME/.nvm"
export NODE_OPTIONS="--use-openssl-ca"

# --- PATH ---
typeset -U path

path=(
  $PNPM_HOME/bin
  ~/.aspire/bin
  ~/bin
  ~/.local/bin
  ~/.npm-global/bin
  $path
  $GOROOT/bin
  $GOPATH/bin
)
path=($^path(N-/))

# Plugins
zinit ice wait"0" lucid blockf
zinit light zsh-users/zsh-completions

zinit ice wait"0" lucid atload"_zsh_autosuggest_start"
zinit light zsh-users/zsh-autosuggestions

zinit ice wait"0" lucid atinit"zicompinit; zicdreplay"
zinit light zsh-users/zsh-syntax-highlighting

zinit ice wait"1" lucid
zinit snippet "$NVM_DIR/nvm.sh"

# --- ALIASES ---
# Eza
alias ls='eza --icons'
alias ll='eza -lh --icons --git'
alias la='eza -la --icons --git'

# Bat
alias cat='bat --paging=never'
alias less='bat'
export MANPAGER="sh -c 'col -bx | bat -l man -p'"

# Git
alias gs='git status'
alias gp='git pull'
alias gcm='git commit -m'

# Clear
alias c='clear'

# --- STARSHIP / ZOXIDE ---
eval "$(starship init zsh)"
eval "$(zoxide init zsh)"
